name: tests
on: [pull_request]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: CGO_ENABLED=0 go test -count=1 -timeout 180s ./...
