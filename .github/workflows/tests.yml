name: tests
on: [pull_request]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python oracle at 4cc9fa1
        run: sh scripts/setup-python-oracle.sh "${{ runner.temp }}/md-oracle"
      - name: Tests
        env:
          MARKITDOWN_ORACLE: ${{ runner.temp }}/md-oracle/oracle
        run: CGO_ENABLED=0 go test -count=1 -timeout 300s ./...
